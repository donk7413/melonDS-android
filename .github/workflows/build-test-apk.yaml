name: Build test APK

# Builds an installable APK (nightly flavor, signed with a throwaway key) for testing branches.
on:
  push:
    branches: [ 'claude/**' ]

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: zulu
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build melonDS Android
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          sed -i -e 's/\(versionName = "\)\(.*\)\("\)/\1\2 ('"$COMMIT"')\3/g' buildSrc/src/main/kotlin/AppConfig.kt
          keytool -genkeypair -keystore ${{runner.workspace}}/keystore.jks -alias melonds -keyalg RSA -keysize 2048 -validity 10000 -storepass testbuild -keypass testbuild -dname "CN=melonDS test build"
          echo "MELONDS_KEYSTORE=${{runner.workspace}}/keystore.jks" >> local.properties
          echo "MELONDS_KEYSTORE_PASSWORD=testbuild" >> local.properties
          echo "MELONDS_KEY_ALIAS=melonds" >> local.properties
          echo "MELONDS_KEY_PASSWORD=testbuild" >> local.properties
          chmod +x ./gradlew
          ./gradlew :app:assembleGitHubNightlyRelease

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: melonDS-android-test
          path: app/build/outputs/apk/gitHubNightly/release/app-gitHub-nightly-release.apk
